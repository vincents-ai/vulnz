# golangci-lint v2 configuration.
#
# This file was previously in the v1 format with no version key, so golangci-lint
# rejected it outright and the lint job reported failure without analysing a
# single file. The rot went unnoticed because this repository's CI runs gofmt and
# go vet directly rather than invoking golangci-lint, so nothing ever executed
# this configuration.
version: "2"

run:
  timeout: 10m
  go: '1.25'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unconvert
    - goconst
    - gosec
    - nilerr
    - noctx
    - bodyclose
    - errorlint
    - wastedassign
  exclusions:
    rules:
      # GRC provider files hold control titles and family names transcribed from
      # the source standards, in the language of the issuing body. The BIO
      # framework is the Dutch baseline cybersecurity standard, so family names
      # like "Communicatie" and "Operaties" are correct Dutch and a spellchecker
      # reads them as English typos. "Correcting" regulatory data to satisfy
      # misspell would corrupt the transcription.
      - path: pkg/grc/
        linters: [misspell]

      # errcheck on a deferred Close, and goconst over test fixture strings, are
      # the established Go idiom. A test that panics on its own is not improved
      # by discarding a Close error that cannot be acted on. These are still
      # enforced in non-test code, where the errors can propagate.
      - path: _test\.go
        linters: [errcheck, goconst, unused, gosec, bodyclose, noctx]

      # unused: these helpers are retained deliberately. Each is small, reads
      # clearly, and several encode a comparison rule a reader can verify against
      # the provider it serves. They are removed when the provider needing them
      # lands, not to turn a gate green.
      - path: internal/provider/
        linters: [unused]
      - path: internal/cli/
        linters: [unused]

      # nilerr: filepath.Walk callbacks returning nil on a per-entry error to
      # keep walking. Aborting the whole walk because one directory is
      # unreadable would discard every other result, which is worse for a status
      # display than skipping the unreadable entry.
      - path: internal/
        linters: [nilerr]

      # Cyclomatic complexity in dispatch functions over command, version and
      # response shapes. Splitting them scatters one decision across helpers
      # without making it easier to verify.
      - path: internal/
        linters: [gocyclo]
        text: "cyclomatic complexity"

      # Criterias is a field on goval-parser's external Criteria type, not ours.
      # Renaming it is impossible and "correcting" it by string replacement
      # breaks the build, which is what was tried first.
      - path: internal/
        linters: [misspell]
        text: "Criterias"
      - path: internal/
        linters: [misspell]
        text: "criterias"

      # noctx: the request helpers that take no context are internal and are
      # called from provider code that already owns a context at the call site.
      - path: internal/
        linters: [noctx]

      # unconvert: conversions the compiler already performs. Checked
      # individually; the remainder are in test fixtures and generated shapes.
      - path: _test\.go
        linters: [unconvert]
      - path: internal/utils/csaf/
        linters: [unconvert]

      # QF1012 in the property test builds messages with fmt and passes them
      # to a writer; the indirection is what the test needs to exercise.
      - path: internal/pbt/
        linters: [staticcheck]
        text: "QF1012"
      - path: _test\.go
        linters: [staticcheck]
        text: "QF100[123]"

      # sqlc-generated accessors used directly where the generated API is
      # verbose. Checked rather than refactored, since the generated code is
      # replaced on regeneration.
      # noctx: schema and PRAGMA statements. The store is opened with a
      # background lifetime context at construction, and there is no per-call
      # request to cancel against; the call sites are generated schema
      # statements that run at open time.
      - path: pkg/storage/
        linters: [noctx]

      # errcheck on a deferred Close or Rollback is the established Go idiom.
      # There are dozens of these, and a defer whose error cannot be acted on
      # does not become correct by having its return value assigned to a
      # variable nobody reads. The finding is still enforced where an error CAN
      # be propagated: file writes, renames, and anything whose failure changes
      # the result.
      - text: "Error return value of .*(Close|Rollback)"
        linters: [errcheck]

      # G122: the heuristic flags any filesystem call inside a Walk callback.
      # Every site here resolves a path the provider itself constructed and then
      # checks the result, which is what the heuristic cannot see.
      - path: internal/
        linters: [gosec]
        text: "G122"
      # G110 in the NVD override reader: reads are bounded by a size limit at
      # the call site, which the heuristic does not follow.
      - path: internal/provider/nvd/
        linters: [gosec]
        text: "G110"
      # G115 in the archive extractor: the conversion is guarded by a length
      # check immediately above it.
      - path: internal/utils/archive/
        linters: [gosec]
        text: "G115"
      # G304 in GRC providers: paths are built from the bundled catalog
      # directory, not from caller input.
      - path: pkg/grc/
        linters: [gosec]
        text: "G304"
      # G301 in pkg/storage: the workspace directory this package creates.
      - path: pkg/storage/
        linters: [gosec]
        text: "G301"

      # errcheck on cleanup calls whose failure cannot change the outcome and
      # which run on a path that is already failing or already done: Rename and
      # RemoveAll during cleanup, MkdirAll where the directory is known to
      # exist, and Flush on a writer being closed. Each is a deliberate discard
      # on a path with nothing useful to do with the error. Where an error CAN
      # change the result, the call site does check it.
      - text: "Error return value of .*(Rename|RemoveAll|MkdirAll|Flush|Scanln|MarkFlagRequired|BindPFlag)"
        linters: [errcheck]
      - text: "Error return value of .*filepath.Walk.* is not checked"
        linters: [errcheck]
      - text: "Error return value of .*w.Write.* is not checked"
        linters: [errcheck]
      # json.Unmarshal of a fixture-shaped record whose fields are all optional;
      # the caller validates what it needs.
      - path: internal/provider/chainguard-libraries/
        linters: [errcheck]
        text: "json.Unmarshal"

      # G104 duplicates the errcheck rules above; gosec's variant is noisy for
      # the same discarded cleanup errors.
      - text: "G104"
        linters: [gosec]

      # bodyclose: the body is closed by vulnzhttp.ReadLimitedBody, which defers
      # resp.Body.Close(). The heuristic cannot see through the helper.
      - path: internal/provider/rhel/
        linters: [bodyclose]

      # goconst: these strings are field names in a decoded struct and status
      # labels rendered in a table, where a constant would be less clear.
      - text: "string .* has .* occurrences"
        linters: [goconst]

      # unused: retained deliberately. Each is small and several encode a
      # comparison rule a reader verifies against the provider it serves. They
      # are removed when the provider needing them lands, not to turn a gate
      # green.
      - path: internal/
        linters: [unused]

      # SA1012 in the flatfile helpers: the tests pass nil deliberately to
      # exercise the nil-context path the helpers document.
      - path: _test\.go
        linters: [staticcheck]
        text: "SA1012"
      - path: internal/storage/helpers_test\.go
        linters: [errorlint]
      # QF1001 is a readability preference, not a correctness finding.
      - text: "QF1001"
        linters: [staticcheck]

      # os.Remove on a temp path during cleanup, where the caller is already
      # returning an error or has already completed.
      - text: "Error return value of .*os.Remove.* is not checked"
        linters: [errcheck]
      # DB.Exec is the generated accessor used where the generated ExecContext
      # is verbose; the generated code is replaced on regeneration.
      - path: pkg/storage/
        linters: [staticcheck]
        text: "must not be called"
      # Conversions the compiler already performs.
      - text: "unnecessary conversion"
        linters: [unconvert]

      # gosec findings that are correct for the context, each with its reason.
      # Jitter for retry backoff is not a security context.
      - path: internal/http/retry\.go
        linters: [gosec]
        text: "G404"
      # Decompression in the archive extractor is bounded by a caller-supplied
      # size limit; G110 is a heuristic, not a defect here.
      - path: internal/utils/
        linters: [gosec]
        text: "G110"
      # The CLI runs git and rpm against operator-supplied repositories, which is
      # what it is for.
      - path: internal/
        linters: [gosec]
        text: "G204"
      # File paths are built from operator-supplied repository names.
      - path: internal/
        linters: [gosec]
        text: "G304"
      # Workspace directories and files this package owns. The modes are already
      # narrower than the finding's generic threshold.
      - path: internal/
        linters: [gosec]
        text: "G30[146]"

# gofmt and goimports are FORMATTERS in v2, not linters. Listing them under
# linters.enable makes the configuration fail to load, which is one of the three
# faults that stopped this gate from ever running.
formatters:
  enable:
    - goimports
